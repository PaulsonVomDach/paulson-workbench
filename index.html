  P1: { title: 'Phase 1 – Schonung', subtitle: 'Reha · Schulter', mainLabel: 'Mobilisation',
    warmup: [],
    main: [
      {name:'Pendelübung', cue:'sanfte Mobilisation ohne Last · 2x/Tag', sides:true, durationSec:30},
      {name:'Schulterblatt-Retraktion', cue:'ohne Band, langsam', sets:3, reps:'10 Wdh', pauseSec:30},
      {name:'Brustdehnung im Türrahmen', cue:'sanft', sets:2, durationSec:30, pauseSec:20},
    ],
    cooldown: [],
  },
  P2: { title: 'Phase 2 – Korrektur', subtitle: 'Reha · ~12 Min · 3x/Woche', mainLabel: 'Korrektur Dysbalance',
    warmup: [],
    main: [
      {name:'Externe Rotation', cue:'leichtes Band · Außenrotatoren', sets:3, reps:'15 Wdh je Seite', pauseSec:45},
      {name:'Interne Rotation', cue:'leichtes Band · Balance', sets:3, reps:'15 Wdh je Seite', pauseSec:45},
      {name:'Band Pull-Apart', cue:'leicht · hintere Schulter', sets:3, reps:'15 Wdh', pauseSec:45},
      {name:'Face Pull', cue:'Band auf Gesichtshöhe ziehen', sets:3, reps:'15 Wdh', pauseSec:45},
      {name:'Wall Slides (Wandengel)', cue:'Schulterblattkontrolle, Mobilität', sets:3, reps:'10 Wdh', pauseSec:45},
      {name:'Brustdehnung Türrahmen', sets:2, durationSec:30, pauseSec:20},
    ],
    cooldown: [],
  },
};

function buildSteps(wk) {
  const w = WORKOUTS_DATA[wk];
  const steps = [];
  const pushBlock = (ex, phase, addPauseAfterSet) => {
    const sets = ex.sets || 1;
    const sides = ex.sides ? 2 : 1;
    for (let s = 1; s <= sets; s++) {
      for (let side = 1; side <= sides; side++) {
        let sub = '';
        if (sets > 1 && sides > 1) sub = `Seite ${side} · Satz ${s}/${sets}`;
        else if (sets > 1) sub = `Satz ${s}/${sets}`;
        else if (sides > 1) sub = `Seite ${side} von 2`;
        steps.push({type:'exercise', phase, name: ex.name, cue: ex.cue || '', reps: ex.reps || '', sub, durationSec: ex.durationSec || 0});
        const isLastOfBlock = s === sets && side === sides;
        if (addPauseAfterSet && ex.pauseSec && !isLastOfBlock) steps.push({type:'pause', phase, durationSec: ex.pauseSec});
      }
    }
  };
  w.warmup.forEach(ex => pushBlock(ex, 'warmup', false));
  w.main.forEach((ex, idx) => {
    pushBlock(ex, 'main', true);
    if (ex.pauseSec && idx !== w.main.length - 1) steps.push({type:'pause', phase:'main', durationSec: ex.pauseSec});
  });
  w.cooldown.forEach(ex => pushBlock(ex, 'cooldown', false));
  return steps;
}

const PHASE_LABELS = { warmup: 'Warm-up', main: 'Hauptteil', cooldown: 'Cool-down' };
function phaseLabelFor(step){
  const w = WORKOUTS_DATA[state.workoutKey];
  if(step.phase === 'main' && w && w.mainLabel) return w.mainLabel;
  return PHASE_LABELS[step.phase];
}
let state = { screen: 'home', workoutKey: null, steps: [], stepIndex: 0, timerPhase: 'idle', remaining: 0, timerId: null, actx: null, wakeLock: null };

async function requestWakeLock(){
  try{
    if('wakeLock' in navigator){
      state.wakeLock = await navigator.wakeLock.request('screen');
      state.wakeLock.addEventListener('release', ()=>{ state.wakeLock=null; });
    }
  }catch(e){}
}
function releaseWakeLock(){
  if(state.wakeLock){ try{ state.wakeLock.release(); }catch(e){} state.wakeLock=null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.screen==='session') requestWakeLock();
});

function $(id){ return document.getElementById(id); }
function show(id, on){ $(id).classList.toggle('hidden', !on); }

function unlockAudio(){
  try{
    const ctx = state.actx || (state.actx = new (window.AudioContext || window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    const buffer = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buffer; src.connect(ctx.destination); src.start(0);
  }catch(e){}
  try{
    const el = $('beep-audio');
    el.volume = 1;
    const p = el.play();
    if(p && p.then) p.then(()=>{ el.pause(); el.currentTime = 0; }).catch(()=>{});
    else { el.pause(); el.currentTime = 0; }
  }catch(e){}
}

function playBeepOnce(delay){
  setTimeout(()=>{
    try{
      const el = $('beep-audio');
      const clone = el.cloneNode(true);
      clone.volume = 1;
      clone.play().catch(()=>{});
    }catch(e){}
  }, delay);
}
function beep(){
  // HTML5 audio element (unlocked on Start tap) survives iOS autoplay rules better than raw WebAudio
  playBeepOnce(0);
  playBeepOnce(280);
  playBeepOnce(560);
  // fallback oscillator too, in case the element path fails silently
  try{
    const ctx = state.actx || (state.actx = new (window.AudioContext || window.webkitAudioContext)());
    if(ctx.state === 'suspended') ctx.resume();
    const now = ctx.currentTime;
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='square'; o.frequency.value=1000; g.gain.value=0.0001;
      o.connect(g); g.connect(ctx.destination);
      const t = now + i*0.28;
      g.gain.exponentialRampToValueAtTime(0.5, t+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
      o.start(t); o.stop(t+0.25);
    }
  }catch(e){}
  if(navigator.vibrate){ try{ navigator.vibrate([200,100,200,100,200]); }catch(e){} }
}

function clearTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId=null; } }

function fmt(sec){ return sec>=60 ? `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}` : String(sec); }

function chooseWorkout(key){ state.workoutKey = key; state.screen='intro'; render(); }
function startWorkout(){ unlockAudio(); requestWakeLock(); state.steps = buildSteps(state.workoutKey); state.stepIndex=0; state.screen='session'; render(); enterStep(0); }
function goHome(){ clearTimer(); releaseWakeLock(); state.screen='home'; state.workoutKey=null; state.steps=[]; state.stepIndex=0; render(); }

function enterStep(index){
  clearTimer();
  if(index >= state.steps.length){ state.screen='end'; releaseWakeLock(); render(); return; }
  const step = state.steps[index];
  state.stepIndex = index;
  if(step.type==='pause'){ state.timerPhase='main'; state.remaining=step.durationSec; state.timerId=setInterval(tick,1000); }
  else if(step.type==='exercise' && step.durationSec){ state.timerPhase='prep'; state.remaining=10; state.timerId=setInterval(tick,1000); }
  else { state.timerPhase='idle'; state.remaining=0; }
  render();
}

function tick(){
  state.remaining -= 1;
  if(state.remaining <= 0){
    clearTimer();
    beep();
    const step = state.steps[state.stepIndex];
    if(step.type==='exercise' && state.timerPhase==='prep'){
      state.timerPhase='main'; state.remaining=step.durationSec;
      state.timerId=setInterval(tick,1000);
      render();
      return;
    }
    setTimeout(()=>enterStep(state.stepIndex+1), 300);
    render();
    return;
  }
  render();
}

function markDone(){ enterStep(state.stepIndex+1); }
function goNext(){ enterStep(state.stepIndex+1); }
function goPrev(){ if(state.stepIndex>0) enterStep(state.stepIndex-1); }

function render(){
  show('screen-home', state.screen==='home');
  show('screen-intro', state.screen==='intro');
  show('screen-session', state.screen==='session');
  show('screen-end', state.screen==='end');

  if(state.screen==='intro' && state.workoutKey){
    $('intro-subtitle').textContent = WORKOUTS_DATA[state.workoutKey].subtitle;
    $('intro-title').textContent = WORKOUTS_DATA[state.workoutKey].title;
  }

  if(state.screen==='session'){
    const step = state.steps[state.stepIndex];
    $('progress-bar').style.width = Math.round((state.stepIndex/state.steps.length)*100) + '%';
    $('phase-label').textContent = step ? phaseLabelFor(step) : '';
    const isPause = step && step.type==='pause';
    const isTimed = step && step.type==='exercise' && !!step.durationSec;
    const isReps = step && step.type==='exercise' && !step.durationSec;
    show('pane-pause', isPause);
    show('pane-timed', isTimed);
    show('pane-reps', isReps);
    show('btn-done', isReps);
    show('btn-skip', !isReps);
    $('btn-back').style.opacity = state.stepIndex>0 ? '1' : '0.35';

    if(isPause) $('pause-num').textContent = fmt(state.remaining);
    if(isTimed){
      $('timed-name').textContent = step.name;
      $('timed-sub').textContent = step.sub || '';
      $('timed-sub').style.display = step.sub ? '' : 'none';
      $('timed-cue').textContent = step.cue || '';
      $('timed-cue').style.display = step.cue ? '' : 'none';
      const prep = state.timerPhase==='prep';
      $('timed-prep-label').textContent = prep ? 'Startposition einnehmen' : 'Los!';
      const color = prep ? '#ff7a52' : '#5fd694';
      $('timed-prep-label').style.color = color;
      $('timed-ring').style.borderColor = color;
      $('timed-num').textContent = fmt(state.remaining);
    }
    if(isReps){
      $('reps-name').textContent = step.name;
      $('reps-sub').textContent = step.sub || '';
      $('reps-sub').style.display = step.sub ? '' : 'none';
      $('reps-cue').textContent = step.cue || '';
      $('reps-cue').style.display = step.cue ? '' : 'none';
      $('reps-target').textContent = step.reps || '';
    }
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const list = $('workout-list');
  Object.keys(WORKOUTS_DATA).forEach(key => {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = `<div class="tag accent">${WORKOUTS_DATA[key].subtitle}</div><div style="font-size:26px;font-weight:700;">${WORKOUTS_DATA[key].title}</div>`;
    d.addEventListener('click', () => chooseWorkout(key));
    list.appendChild(d);
  });
  $('intro-back').addEventListener('click', goHome);
  $('intro-start').addEventListener('click', startWorkout);
  $('btn-back').addEventListener('click', goPrev);
  $('btn-done').addEventListener('click', markDone);
  $('btn-skip').addEventListener('click', goNext);
  $('end-home').addEventListener('click', goHome);
  render();
});
</script>
</body>
</html>
